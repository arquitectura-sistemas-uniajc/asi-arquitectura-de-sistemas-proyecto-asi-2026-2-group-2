upstream api_eventoya {
    server api1:3000;
    server api2:3000;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_eventoya;
        proxy_set_header Host $host;
        add_header X-Upstream-Server $upstream_addr always;
    }
}
